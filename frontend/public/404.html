<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<style>
  /* =====================================================================
     MINIMALIST TYPOGRAPHIC 404
     Palette: #F4F3EF (Off-white), #111 (Near-black), #FF4D1C (Accent vermilion)
     ===================================================================== */
  :root {
    --bg-color: #F4F3EF;
    --text-color: #111111;
    --accent-color: #FF4D1C;
    --font-grotesk: 'Inter Tight', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  }

  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 100%;
    height: 100%;
    background-color: var(--bg-color);
    color: var(--text-color);
    font-family: var(--font-grotesk);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    touch-action: manipulation;
  }

  /* Accessibility visually hidden */
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  /* Corner URL indicator */
  .url-tag {
    position: fixed;
    top: 2rem;
    left: 2.5rem;
    font-family: var(--font-mono);
    font-size: 0.75rem;
    letter-spacing: 0.04em;
    color: rgba(17, 17, 17, 0.45);
    user-select: none;
    pointer-events: none;
    z-index: 10;
  }

  /* Centered Canvas Container */
  main {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    text-align: center;
  }

  /* 404 Big Digits Display */
  .digits-display {
    display: inline-flex;
    align-items: baseline;
    justify-content: center;
    font-size: clamp(6.5rem, 38vw, 32rem);
    line-height: 0.82;
    letter-spacing: -0.04em;
    font-weight: 800;
    font-variation-settings: 'wght' 800;
    user-select: none;
    cursor: default;
    position: relative;
  }

  .digit {
    display: inline-block;
    position: relative;
    will-change: transform, font-variation-settings;
    transform: translate3d(0, 0, 0);
    transition: font-variation-settings 120ms var(--ease-out);
  }

  /* The wandering digit '0' idle drift animation */
  .digit-zero.wandering {
    animation: driftSequence 5.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  }

  @keyframes driftSequence {
    0% {
      transform: translate3d(0, 0, 0) rotate(0deg);
      font-variation-settings: 'wght' 800;
    }
    30% {
      transform: translate3d(0.28em, -0.16em, 0) rotate(9.5deg);
      font-variation-settings: 'wght' 420;
    }
    55% {
      transform: translate3d(0.38em, -0.08em, 0) rotate(14deg);
      font-variation-settings: 'wght' 360;
    }
    75% {
      transform: translate3d(0.18em, 0.04em, 0) rotate(4deg);
      font-variation-settings: 'wght' 620;
    }
    100% {
      transform: translate3d(0, 0, 0) rotate(0deg);
      font-variation-settings: 'wght' 800;
    }
  }

  /* Subtitle copy */
  .meta-content {
    margin-top: clamp(1.2rem, 3vw, 2.4rem);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.15rem;
  }

  .copy-text {
    font-size: clamp(1.05rem, 1.9vw, 1.45rem);
    font-weight: 400;
    letter-spacing: -0.02em;
    color: var(--text-color);
    line-height: 1.3;
  }

  /* The single accent color mark */
  .accent-mark {
    color: var(--accent-color);
    font-weight: 600;
  }

  /* Plain text link with animated underline */
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    font-size: clamp(0.95rem, 1.4vw, 1.1rem);
    font-weight: 500;
    letter-spacing: -0.01em;
    color: var(--text-color);
    text-decoration: none;
    position: relative;
    padding-bottom: 3px;
    outline: none;
    transition: color 250ms var(--ease-out);
  }

  .back-link::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 1.5px;
    background-color: var(--text-color);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 320ms var(--ease-out);
  }

  .back-link:hover::after {
    transform: scaleX(1);
  }

  /* Accessible visible keyboard focus */
  .back-link:focus-visible {
    outline: 2px solid var(--text-color);
    outline-offset: 6px;
  }

  .back-link:focus-visible::after {
    transform: scaleX(1);
  }

  /* Responsive layout adjustments */
  @media (max-width: 640px) {
    .url-tag {
      top: 1.5rem;
      left: 1.5rem;
    }

    main {
      padding: 1.5rem;
    }

    .digits-display {
      font-size: clamp(6.2rem, 34vw, 12rem);
      letter-spacing: -0.035em;
    }

    .meta-content {
      margin-top: 1.5rem;
      gap: 1rem;
    }
  }

  /* Reduced motion preference */
  @media (prefers-reduced-motion: reduce) {
    .digit, .digit-zero.wandering {
      transition: none !important;
      transform: none !important;
      animation: none !important;
    }

    .back-link::after {
      transition: none !important;
      transform: scaleX(1) !important;
    }
  }
</style>
</head>
<body>

  <!-- Tiny monospace URL indicator in the top corner -->
  <div class="url-tag" id="url-tag">/404</div>

  <main>
    <h1 class="visually-hidden">Error 404 — Page Not Found</h1>

    <!-- Interactive Digits -->
    <div class="digits-display" aria-hidden="true" id="digits-container">
      <span class="digit" id="digit-1">4</span>
      <span class="digit digit-zero" id="digit-zero">0</span>
      <span class="digit" id="digit-2">4</span>
    </div>

    <!-- Human Copy & Navigation -->
    <div class="meta-content">
      <p class="copy-text">This page wandered off<span class="accent-mark">.</span></p>
      <nav>
        <a href="/" class="back-link">
          <span>&larr;</span>
          <span>Back to home</span>
        </a>
      </nav>
    </div>
  </main>

<script>
  (function () {
    'use strict';

    // Update corner label with typed path or witty default
    const urlTag = document.getElementById('url-tag');
    const path = window.location.pathname;
    urlTag.textContent = (path && path !== '/' && path !== '/404.html') ? path : '/missing-page';

    // Respect user motion preference
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (prefersReducedMotion) return;

    // Elements
    const digitsContainer = document.getElementById('digits-container');
    const digit1 = document.getElementById('digit-1');
    const digitZero = document.getElementById('digit-zero');
    const digit2 = document.getElementById('digit-2');
    const digits = [
      { el: digit1, currentX: 0, currentY: 0, targetX: 0, targetY: 0, currentWght: 800, targetWght: 800, currentSkew: 0, targetSkew: 0 },
      { el: digitZero, currentX: 0, currentY: 0, targetX: 0, targetY: 0, currentWght: 800, targetWght: 800, currentSkew: 0, targetSkew: 0 },
      { el: digit2, currentX: 0, currentY: 0, targetX: 0, targetY: 0, currentWght: 800, targetWght: 800, currentSkew: 0, targetSkew: 0 }
    ];

    // Interaction state
    let mouseX = -9999;
    let mouseY = -9999;
    let lastActivityTime = performance.now();
    let isWandering = false;
    let driftTimer = null;
    const IDLE_THRESHOLD = 6000; // 6 seconds idle
    const RADIUS = 280; // Distance of influence in pixels
    const MAX_DISPLACE = 26; // Maximum physical displacement px

    // Reset idle timer on any human interaction
    function resetActivity() {
      lastActivityTime = performance.now();
      if (isWandering) {
        isWandering = false;
        digitZero.classList.remove('wandering');
      }
    }

    // Pointer move listener
    window.addEventListener('pointermove', function (e) {
      mouseX = e.clientX;
      mouseY = e.clientY;
      resetActivity();
    }, { passive: true });

    // Touch events for responsive feedback
    window.addEventListener('touchstart', function (e) {
      if (e.touches && e.touches[0]) {
        mouseX = e.touches[0].clientX;
        mouseY = e.touches[0].clientY;
      }
      resetActivity();
    }, { passive: true });

    window.addEventListener('keydown', resetActivity, { passive: true });

    // Device orientation (tilt reaction on mobile)
    let tiltX = 0;
    let tiltY = 0;
    window.addEventListener('deviceorientation', function (e) {
      if (e.gamma !== null && e.beta !== null) {
        // Gamma: left-to-right tilt [-90, 90]
        // Beta: front-to-back tilt [-180, 180]
        tiltX = Math.min(Math.max(e.gamma, -30), 30) * 0.45;
        tiltY = Math.min(Math.max(e.beta - 45, -30), 30) * 0.35;
        resetActivity();
      }
    }, { passive: true });

    // When wandering animation completes, reset
    digitZero.addEventListener('animationend', function () {
      isWandering = false;
      digitZero.classList.remove('wandering');
      lastActivityTime = performance.now();
    });

    // Main 60/120fps physics loop (RAF)
    function tick(now) {
      // Check 6s idle drift condition
      if (!isWandering && (now - lastActivityTime >= IDLE_THRESHOLD)) {
        isWandering = true;
        digitZero.classList.add('wandering');
      }

      // Physics calculation for each glyph
      digits.forEach(function (d) {
        // If '0' is wandering, let CSS handle it
        if (d.el === digitZero && isWandering) return;

        const rect = d.el.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;

        const dx = mouseX - centerX;
        const dy = mouseY - centerY;
        const dist = Math.hypot(dx, dy);

        if (dist < RADIUS && dist > 0) {
          const factor = Math.pow(1 - dist / RADIUS, 1.5);
          const angle = Math.atan2(dy, dx);

          // Displace away from cursor
          d.targetX = -Math.cos(angle) * (factor * MAX_DISPLACE) + tiltX;
          d.targetY = -Math.sin(angle) * (factor * MAX_DISPLACE) + tiltY;

          // Modulate weight and skew via variable font
          d.targetWght = 800 - factor * 350; // Shifts from 800 down to 450
          d.targetSkew = -(dx / RADIUS) * 11; // Skews gently away
        } else {
          // Return to rest
          d.targetX = tiltX;
          d.targetY = tiltY;
          d.targetWght = 800;
          d.targetSkew = 0;
        }

        // Smooth Lerp (Linear Interpolation) with ease-out feel
        d.currentX += (d.targetX - d.currentX) * 0.14;
        d.currentY += (d.targetY - d.currentY) * 0.14;
        d.currentWght += (d.targetWght - d.currentWght) * 0.14;
        d.currentSkew += (d.targetSkew - d.currentSkew) * 0.14;

        // Apply hardware-accelerated transforms
        d.el.style.transform = 'translate3d(' + d.currentX.toFixed(2) + 'px, ' + d.currentY.toFixed(2) + 'px, 0) skewX(' + d.currentSkew.toFixed(2) + 'deg)';
        d.el.style.fontVariationSettings = "'wght' " + Math.round(d.currentWght);
      });

      requestAnimationFrame(tick);
    }

    requestAnimationFrame(tick);
  })();
</script>
</body>
</html>
